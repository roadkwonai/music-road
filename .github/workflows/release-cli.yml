name: Road Music CLI Release

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing CLI version tag (cli-vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cli-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the exact CLI release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate CLI version and prepare release notes
        id: release_notes
        env:
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          CLI_VERSION="$(node -p 'require("./cli/package.json").version')"
          if [ "$RELEASE_TAG" != "cli-v$CLI_VERSION" ]; then
            echo "Tag/CLI version mismatch" >&2
            exit 1
          fi
          node scripts/release-notes.js resolve-cli --version "$CLI_VERSION" --output "$RELEASE_NOTES_FILE" --github-output "$GITHUB_OUTPUT"
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run dist:cli
      - name: Verify CLI kit and prepare checksums
        run: |
          node scripts/release-assets.js --product cli
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
      - name: Publish CLI release without changing the app latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ steps.release_notes.outputs.release_title }}
          RELEASE_NOTE_PATH: ${{ steps.release_notes.outputs.release_note_path }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTE_PATH" "dist/RoadMusic-CLI-${RELEASE_TAG#cli-v}.zip" dist/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest=false

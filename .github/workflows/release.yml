name: Road Music App Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate version and prepare release notes
        id: release_notes
        env:
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          export PACKAGE_VERSION
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Tag/version mismatch" >&2
            exit 1
          fi
          node scripts/release-notes.js resolve --version "$PACKAGE_VERSION" --output "$RELEASE_NOTES_FILE" --github-output "$GITHUB_OUTPUT"
      - run: npm ci --include=dev
      - run: npm test
      - name: Verify real Git source update and startup-failure rollback
        run: node scripts/verify-source-update.js
      - run: npm run dist:mac
      - run: npm run dist:source
      - name: Verify bundles and prepare checksums
        run: |
          codesign --verify --deep --strict 'dist/mac-arm64/Road Music.app'
          hdiutil verify "dist/RoadMusic-${RELEASE_TAG#v}-mac-arm64.dmg"
          node scripts/release-assets.js --product app
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
      - name: Publish complete app release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ steps.release_notes.outputs.release_title }}
          RELEASE_NOTE_PATH: ${{ steps.release_notes.outputs.release_note_path }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTE_PATH" "dist/RoadMusic-${RELEASE_TAG#v}-mac-arm64.dmg" "dist/RoadMusic-${RELEASE_TAG#v}-source.zip" dist/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest

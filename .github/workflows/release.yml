name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate version and release notes
        run: |
          node -e 'const fs=require("node:fs"); const v=require("./package.json").version; if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(v) || process.env.RELEASE_TAG !== `v${v}`) throw Error("Tag/version mismatch"); if (!fs.statSync(`docs/releases/v${v}.md`).size) throw Error("Missing release notes")'
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run dist:mac
      - run: npm run dist:cli
      - name: Verify bundles and prepare checksums
        run: |
          codesign --verify --deep --strict 'dist/mac-arm64/Road Music.app'
          hdiutil verify "dist/RoadMusic-${RELEASE_TAG#v}-mac-arm64.dmg"
          node scripts/release-assets.js
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
      - name: Publish complete release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG — GitHub 업데이트" --notes-file "docs/releases/$RELEASE_TAG.md" "dist/RoadMusic-${RELEASE_TAG#v}-mac-arm64.dmg" "dist/RoadMusic-${RELEASE_TAG#v}-cli.zip" dist/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
